<style>
  /* menu-sekmeli-fiyat — module ailesinde fiyatlı satır ve seçim yok (tanitim-sekmeli yalnız vizyon/misyon metni sekmeler). body/menu-liste'nin desing içi kategori + alerjen/arama iskeletinden farkı: data satırı (fiyat · kategori · rozet) okuyan hafif sekme + noktalı satır listesi ve yapışkan «seçim özeti» paneli (adetli toplam); alerjen, arama, yazdırma yok. */
  .modulex-menu-sekmeli-fiyat { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-menu-sekmeli-fiyat *, .modulex-menu-sekmeli-fiyat *::before, .modulex-menu-sekmeli-fiyat *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-menu-sekmeli-fiyat :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-menu-sekmeli-fiyat :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-menu-sekmeli-fiyat :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-menu-sekmeli-fiyat :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-menu-sekmeli-fiyat img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-menu-sekmeli-fiyat) img { height: auto; }
  .modulex-menu-sekmeli-fiyat [hidden] { display: none !important; }
  .modulex-menu-sekmeli-fiyat :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-menu-sekmeli-fiyat :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }

  .modulex-menu-sekmeli-fiyat-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-menu-sekmeli-fiyat-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-menu-sekmeli-fiyat-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-menu-sekmeli-fiyat-dugme:hover { transform: translateY(-2px); }

  .modulex-menu-sekmeli-fiyat-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-menu-sekmeli-fiyat-menu { display: grid; gap: clamp(28px, 4vw, 48px); align-items: start; }
  .modulex-menu-sekmeli-fiyat--js .modulex-menu-sekmeli-fiyat-menu { grid-template-columns: minmax(0, 1fr) minmax(260px, 320px); }
  .modulex-menu-sekmeli-fiyat-ana { display: grid; min-width: 0; }

  .modulex-menu-sekmeli-fiyat-giris { display: grid; gap: 14px; max-width: 720px; margin-block-end: 28px; }

  .modulex-menu-sekmeli-fiyat-sekmeler::-webkit-scrollbar { display: none; }
  .modulex-menu-sekmeli-fiyat:not(.modulex-menu-sekmeli-fiyat--js) .modulex-menu-sekmeli-fiyat-sekmeler { display: none; }
  .modulex-menu-sekmeli-fiyat-sekme { position: relative; flex: none; padding: 12px 18px; border: 0; background: none; color: --muted--; font: inherit; font-weight: 700; transition: color 0.25s ease; }
  .modulex-menu-sekmeli-fiyat-sekme::after { content: ""; position: absolute; inset-inline: 12px; inset-block-end: -2px; height: 3px; border-radius: 3px; background: --accent--; transform: scaleX(0); transition: transform 0.3s ease; }
  .modulex-menu-sekmeli-fiyat-sekme:hover { color: --text--; }
  .modulex-menu-sekmeli-fiyat-sekme[aria-selected="true"] { color: --text--; }
  .modulex-menu-sekmeli-fiyat-sekme[aria-selected="true"]::after { transform: scaleX(1); }
  .modulex-menu-sekmeli-fiyat-grup { display: grid; gap: 4px; animation: modulex-menu-sekmeli-fiyat-gir 0.4s ease both; }
  .modulex-menu-sekmeli-fiyat-grup + .modulex-menu-sekmeli-fiyat-grup { margin-block-start: 30px; }
  .modulex-menu-sekmeli-fiyat-gad { padding-block-end: 6px; font-family: var(--mx-font-heading, inherit); font-size: 1.35rem; font-weight: 750; }
  .modulex-menu-sekmeli-fiyat--js .modulex-menu-sekmeli-fiyat-sekmeler ~ .modulex-menu-sekmeli-fiyat-gruplar .modulex-menu-sekmeli-fiyat-gad { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .modulex-menu-sekmeli-fiyat-satirlar { display: grid; }
  .modulex-menu-sekmeli-fiyat-satir { display: grid; grid-template-columns: auto minmax(24px, 1fr) auto auto; align-items: baseline; column-gap: 12px; row-gap: 2px; padding-block: 14px; border-block-end: 1px dashed --cizgi--; transition: background 0.25s ease; }
  .modulex-menu-sekmeli-fiyat-satir.modulex-menu-sekmeli-fiyat--secili { background: linear-gradient(90deg, color-mix(in srgb, --accent-- 7%, transparent), transparent 70%); }
  [dir="rtl"] .modulex-menu-sekmeli-fiyat-satir.modulex-menu-sekmeli-fiyat--secili { background: linear-gradient(270deg, color-mix(in srgb, --accent-- 7%, transparent), transparent 70%); }
  .modulex-menu-sekmeli-fiyat-urun { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; min-width: 0; }
  .modulex-menu-sekmeli-fiyat-uikon { align-self: center; color: --accentInk--; font-size: 20px; }
  .modulex-menu-sekmeli-fiyat-uad { font-size: 1.08rem; font-weight: 700; }
  .modulex-menu-sekmeli-fiyat-rozet { padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-menu-sekmeli-fiyat-nokta { align-self: end; margin-block-end: 0.45em; border-block-end: 2px dotted color-mix(in srgb, --text-- 32%, transparent); }
  .modulex-menu-sekmeli-fiyat-fiyat { color: --accentInk--; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .modulex-menu-sekmeli-fiyat-acik { grid-column: 1 / -1; max-width: 60ch; color: --muted--; font-size: 0.92rem; }
  .modulex-menu-sekmeli-fiyat-ekle { position: relative; display: inline-grid; place-items: center; align-self: center; width: 38px; height: 38px; border: 1.5px solid --accent--; border-radius: 50%; background: transparent; color: --accentInk--; transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease; }
  .modulex-menu-sekmeli-fiyat-ekle:hover { transform: scale(1.08); }
  .modulex-menu-sekmeli-fiyat-ekle[aria-pressed="true"] { background: --accent--; color: --accentText--; }
  .modulex-menu-sekmeli-fiyat-adet { position: absolute; inset-block-start: -7px; inset-inline-end: -7px; min-width: 20px; height: 20px; padding-inline: 5px; border-radius: 999px; background: --text--; color: --bg--; font-size: 0.72rem; font-weight: 800; line-height: 20px; text-align: center; }
  .modulex-menu-sekmeli-fiyat-adet:empty { display: none; }
  .modulex-menu-sekmeli-fiyat-gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .modulex-menu-sekmeli-fiyat-secim { position: sticky; inset-block-start: 96px; z-index: 2; display: grid; gap: 14px; padding: 22px; border: 1px solid --cizgi--; border-radius: --yuvarlak--; background: --kartBg--; box-shadow: 0 30px 60px -48px color-mix(in srgb, --text-- 70%, transparent); }
  .modulex-menu-sekmeli-fiyat-sbaslik { display: flex; align-items: center; gap: 8px; font-size: 1.1rem; font-weight: 750; }
  .modulex-menu-sekmeli-fiyat-sbaslik .material-symbols-outlined { color: --accentInk--; }
  .modulex-menu-sekmeli-fiyat-sbos { color: --muted--; font-size: 0.9rem; }
  .modulex-menu-sekmeli-fiyat-sliste { display: grid; gap: 8px; max-height: 300px; overflow-y: auto; }
  .modulex-menu-sekmeli-fiyat-sliste:empty { display: none; }
  .modulex-menu-sekmeli-fiyat-sliste li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 8px; font-size: 0.92rem; animation: modulex-menu-sekmeli-fiyat-gir 0.3s ease both; }
  .modulex-menu-sekmeli-fiyat-sadet { color: --accentInk--; font-weight: 800; font-variant-numeric: tabular-nums; }
  .modulex-menu-sekmeli-fiyat-sfiyat { font-variant-numeric: tabular-nums; }
  .modulex-menu-sekmeli-fiyat-sazalt { display: inline-grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 50%; background: color-mix(in srgb, --text-- 8%, transparent); color: inherit; transition: background 0.2s ease; }
  .modulex-menu-sekmeli-fiyat-sazalt:hover { background: color-mix(in srgb, --accent-- 22%, transparent); }
  .modulex-menu-sekmeli-fiyat-sazalt .material-symbols-outlined { font-size: 18px; }
  .modulex-menu-sekmeli-fiyat-toplam { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block-start: 12px; border-block-start: 2px solid --text--; font-weight: 800; }
  .modulex-menu-sekmeli-fiyat-toplam strong { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  .modulex-menu-sekmeli-fiyat-snot { color: --muted--; font-size: 0.82rem; }
  .modulex-menu-sekmeli-fiyat-temizle { justify-self: start; padding: 0; border: 0; background: none; color: --muted--; font: inherit; font-size: 0.85rem; text-decoration: underline; text-underline-offset: 3px; transition: color 0.2s ease; }
  .modulex-menu-sekmeli-fiyat-temizle:hover { color: --accentInk--; }
  @keyframes modulex-menu-sekmeli-fiyat-gir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 1024px) {
    .modulex-menu-sekmeli-fiyat--js .modulex-menu-sekmeli-fiyat-menu { grid-template-columns: minmax(0, 1fr); }
    .modulex-menu-sekmeli-fiyat-secim { inset-block: auto 12px; }
  }
  @media (max-width: 768px) {
    .modulex-menu-sekmeli-fiyat-satir { grid-template-columns: minmax(0, 1fr) auto auto; }
    .modulex-menu-sekmeli-fiyat-nokta { display: none; }
    .modulex-menu-sekmeli-fiyat-sliste { max-height: 150px; }
  }
  .modulex-menu-sekmeli-fiyat-bag { color: inherit; text-decoration: none; }
  .modulex-menu-sekmeli-fiyat-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-menu-sekmeli-fiyat-mbaslik { font-size: 1.05rem; font-weight: 700; }
  .modulex-menu-sekmeli-fiyat-mmetin { color: --muted--; font-size: 0.95rem; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-menu-sekmeli-fiyat :is(.modulex-menu-sekmeli-fiyat-baslik, .modulex-menu-sekmeli-fiyat-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-menu-sekmeli-fiyat-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-menu-sekmeli-fiyat { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-menu-sekmeli-fiyat *, .modulex-menu-sekmeli-fiyat *::before, .modulex-menu-sekmeli-fiyat *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-menu-sekmeli-fiyat";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const menuSecim = (s, P) => {
        const kok = s.querySelector("[data-menu]");
        if (!kok) return;
        s.classList.add(P + "--js");
        const dl = document.documentElement.lang || undefined;
        const pb = kok.dataset.para || "";
        const bicim = (n) => { try { return new Intl.NumberFormat(dl, pb ? { style: "currency", currency: pb, maximumFractionDigits: n % 1 ? 2 : 0 } : { maximumFractionDigits: 2 }).format(n); } catch (x) { return String(n); } };
        const sek = [...s.querySelectorAll("[data-sekme]")];
        const grp = [...s.querySelectorAll("[data-grup]")];
        const sec = (i, odak) => {
          sek.forEach((b, j) => { b.setAttribute("aria-selected", String(j === i)); b.tabIndex = j === i ? 0 : -1; if (j === i && odak) b.focus(); });
          grp.forEach((g, j) => { g.hidden = j !== i; });
        };
        if (sek.length > 1) {
          sek.forEach((b, i) => {
            b.addEventListener("click", () => sec(i));
            b.addEventListener("keydown", (e) => {
              const rtl = getComputedStyle(s).direction === "rtl";
              let n = null;
              if (e.key === (rtl ? "ArrowLeft" : "ArrowRight")) n = i + 1;
              else if (e.key === (rtl ? "ArrowRight" : "ArrowLeft")) n = i - 1;
              else if (e.key === "Home") n = 0;
              else if (e.key === "End") n = sek.length - 1;
              if (n === null) return;
              e.preventDefault();
              sec((n + sek.length) % sek.length, true);
            });
          });
          sec(0);
        }
        const kutu = s.querySelector("[data-secim]");
        const liste = s.querySelector("[data-sliste]");
        const top = s.querySelector("[data-toplam]");
        const bos = s.querySelector("[data-sbos]");
        const sil = s.querySelector("[data-temizle]");
        if (!kutu || !liste || !top) return;
        const adet = new Map();
        const satir = [...s.querySelectorAll("[data-urun]")];
        const ciz = () => {
          let t = 0;
          let var1 = false;
          const ogeler = [];
          satir.forEach((r) => {
            const n = adet.get(r) || 0;
            const b = r.querySelector("[data-ekle]");
            const a = r.querySelector("[data-adet]");
            if (b) b.setAttribute("aria-pressed", String(n > 0));
            if (a) a.textContent = n ? String(n) : "";
            r.classList.toggle(P + "--secili", n > 0);
            if (!n) return;
            const f = Number(r.dataset.fiyat);
            if (r.dataset.fiyat && Number.isFinite(f)) { t += f * n; var1 = true; }
            const li = document.createElement("li");
            const ad = document.createElement("span");
            ad.className = P + "-sadet";
            ad.textContent = n + "×";
            const isim = document.createElement("span");
            isim.className = P + "-sad";
            isim.textContent = r.dataset.ad || "";
            const fy = document.createElement("bdi");
            fy.className = P + "-sfiyat";
            fy.textContent = r.dataset.fiyat && Number.isFinite(f) ? bicim(f * n) : "";
            const az = document.createElement("button");
            az.type = "button";
            az.className = P + "-sazalt";
            az.setAttribute("aria-label", "− " + (r.dataset.ad || ""));
            const ik = document.createElement("span");
            ik.className = "material-symbols-outlined";
            ik.setAttribute("aria-hidden", "true");
            ik.textContent = "remove";
            az.append(ik);
            az.addEventListener("click", () => { adet.set(r, Math.max(0, (adet.get(r) || 0) - 1)); ciz(); });
            li.append(ad, isim, fy, az);
            ogeler.push(li);
          });
          liste.replaceChildren(...ogeler);
          if (bos) bos.hidden = ogeler.length > 0;
          if (sil) sil.hidden = !ogeler.length;
          top.textContent = var1 ? bicim(t) : "—";
        };
        satir.forEach((r) => {
          const b = r.querySelector("[data-ekle]");
          if (!b) return;
          b.hidden = false;
          b.addEventListener("click", () => { adet.set(r, (adet.get(r) || 0) + 1); ciz(); });
        });
        if (sil) sil.addEventListener("click", () => { adet.clear(); ciz(); });
        kutu.hidden = false;
        ciz();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      menuSecim(s, P, az);
    });
  })();
</script>
