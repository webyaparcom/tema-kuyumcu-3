<script>
  (() => {
    const P = "modulex-acilis-dipnot-manset";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const dipnot = (s, P, az) => {
        let t = 0;
        s.querySelectorAll("[data-dipnot]").forEach((a) => {
          const id = (a.getAttribute("href") || "").slice(1);
          const hedef = id ? document.getElementById(id) : null;
          if (!hedef || !s.contains(hedef)) return;
          const isik = (on) => { a.classList.toggle(P + "-ref--aktif", on); hedef.classList.toggle(P + "-not--isik", on); };
          [a, hedef].forEach((e) => {
            e.addEventListener("mouseenter", () => isik(true));
            e.addEventListener("mouseleave", () => isik(false));
          });
          a.addEventListener("click", (e) => {
            e.preventDefault();
            s.querySelectorAll("." + P + "-not--vurgu").forEach((x) => x.classList.remove(P + "-not--vurgu"));
            hedef.classList.add(P + "-not--vurgu");
            hedef.scrollIntoView({ behavior: az ? "auto" : "smooth", block: "center" });
            hedef.focus({ preventScroll: true });
            clearTimeout(t);
            t = setTimeout(() => hedef.classList.remove(P + "-not--vurgu"), 2600);
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      dipnot(s, P, az);
    });
  })();
</script>
